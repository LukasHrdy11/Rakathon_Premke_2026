[project]
name = "pacs-check"
version = "0.1.0"
description = "PACS Comparator Check – kontrola dostupnosti předchozích vyšetření před plánovaným CT (Rakathon 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydicom>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dimse = ["pynetdicom>=2.1"]

[project.scripts]
pacs-check = "pacs_check.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacs_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
